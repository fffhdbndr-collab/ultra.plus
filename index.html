<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألترا بلس</title>
    <style>
        body {
            background-color: #0b0f19;
            font-family: Tahoma, sans-serif;
            direction: rtl;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الشعار والدائرة */
        .logo-wrapper {
            width: 90px;
            height: 90px;
            background-color: #121824;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.15);
            border: 1px solid #1e293b;
        }

        .lightning-icon {
            font-size: 40px;
            color: #ef4444;
        }

        /* العنوان */
        .profile-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }

        /* شارة التوثيق */
        .verified-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .verified-badge span {
            color: #22c55e;
            font-size: 14px;
        }

        /* الأزرار */
        .action-button {
            background-color: #121824;
            border: 1px solid #1e293b;
            color: #fff;
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        .action-button:hover {
            border-color: #ef4444;
            background-color: #161f30;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon svg {
            width: 20px;
            height: 20px;
            fill: #22c55e;
        }

        .dots {
            color: #64748b;
            letter-spacing: 2px;
            font-size: 16px;
        }

        /* أيقونات التواصل الاجتماعي */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0 20px 0;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            transition: 0.2s;
        }

        .social-icon:hover {
            background-color: #1e293b;
            border-color: #64748b;
        }

        /* حقوق النشر */
        .footer-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="profile-container">
    
    <!-- الشعار الدائري -->
    <div class="logo-wrapper">
        <div class="lightning-icon">⚡</div>
    </div>

    <!-- اسم المتجر -->
    <div class="profile-title">ألترا بلس</div>

    <!-- شارة التوثيق -->
    <div class="verified-badge">
        <span>✔</span> موثقين رسمياً للخدمات والاشتراكات
    </div>

    <!-- زر الطلب -->
    <a href="#" class="action-button">
        <div class="btn-content">
            <span class="btn-icon">🛍️</span>
            <span>أضغط هنا للطلب</span>
        </div>
        <div class="dots">•••</div>
    </a>

    <!-- زر الدعم الفني (بأيقونة الواتساب الرسمية) -->
    <a href="#" class="action-button">
        <div class="btn-content">
            <span class="btn-icon">
                <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.124-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
            </span>
            <span>أضغط هنا للدعم الفني</span>
        </div>
        <div class="dots">•••</div>
    </a>

    <!-- وسائل التواصل الاجتماعي -->
    <div class="social-links">
        <a href="#" class="social-icon">✈️</a>
        <a href="#" class="social-icon">📷</a>
        <a href="#" class="social-icon">🟢</a>
    </div>

    <!-- حقوق النشر -->
    <div class="footer-text">
        جميع الحقوق محفوظة © 2026
    </div>

</div>

</body>
</html>
