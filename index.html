<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألترا بلس | ULTRA PLUS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

        body.landing-body {
            background-color: #0b0709;
            background-image: radial-gradient(circle at center, #1f0c14 0%, #0b0709 70%);
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            direction: rtl;
        }

        .landing-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .landing-logo {
            width: 95px;
            height: 95px;
            background-color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
            overflow: hidden;
        }

        .landing-logo i {
            font-size: 42px;
            color: #ef4444;
        }

        .landing-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .verified-badge {
            color: #d1d5db;
            font-size: 13px;
            margin-bottom: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .verified-badge i {
            color: #22c55e;
            font-size: 14px;
        }

        .landing-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(18, 18, 22, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            margin-bottom: 16px;
            transition: 0.3s;
        }

        .landing-btn:hover {
            background-color: rgba(30, 30, 38, 0.9);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .btn-right-content {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 16px;
            font-weight: 600;
        }

        .btn-right-content i {
            font-size: 18px;
            color: #ffffff;
        }

        .btn-dots {
            color: #9ca3af;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 30px 0 20px 0;
        }

        .social-icons a {
            color: #ffffff;
            background-color: rgba(18, 18, 22, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: 0.3s;
            text-decoration: none;
        }

        .social-icons a:hover {
            background-color: rgba(30, 30, 38, 1);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .landing-footer {
            color: #6b7280;
            font-size: 12px;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body class="landing-body">

    <div class="landing-container">
        <!-- الشعار الدائري -->
        <div class="landing-logo">
            <i class="fa-solid fa-bolt"></i>
        </div>

        <!-- العنوان -->
        <h1 class="landing-title">ألترا بلس</h1>
        
        <!-- شارة التوثيق -->
        <div class="verified-badge">
            <span>موثقين رسمياً للخدمات والاشتراكات</span>
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <!-- زر الطلب (يوجه لصفحة المتجر) -->
        <a href="store.html" class="landing-btn">
            <div class="btn-right-content">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>أضغط هنا للطلب</span>
            </div>
            <div class="btn-dots">•••</div>
        </a>

        <!-- زر الدعم الفني -->
        <a href="https://wa.me/" target="_blank" class="landing-btn">
            <div class="btn-right-content">
                <i class="fa-solid fa-comment-dots"></i>
                <span>أضغط هنا للدعم الفني</span>
            </div>
            <div class="btn-dots">•••</div>
        </a>

        <!-- أيقونات التواصل الاجتماعي -->
        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-telegram"></i></a>
        </div>

        <!-- الفوتر -->
        <footer class="landing-footer">
            جميع الحقوق محفوظة © 2026
        </footer>
    </div>

</body>
</html>
