<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألترا بلس | ULTRA PLUS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0709;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            background-image: radial-gradient(circle at 50% 20%, rgba(239, 68, 68, 0.08) 0%, transparent 60%);
        }
        .main-content {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        /* الشعار الدائري الفخم */
        .logo-container {
            position: relative;
            margin-bottom: 20px;
        }
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #140d12;
            border: 2px solid rgba(239, 68, 68, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
        }
        .logo svg, .logo img {
            width: 45px;
            height: 45px;
            fill: #ef4444;
        }
        /* العنوان والتوثيق */
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #fca5a5;
            margin-bottom: 35px;
        }
        .verified-badge span {
            color: #ef4444;
        }
        /* الأزرار الرئيسية */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 18px 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .btn:hover {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: none;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }
        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* أيقونات السوشيال ميديا الدائرية تحت */
        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }
        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.2s;
        }
        .social-btn:hover {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            transform: scale(1.05);
        }
        /* حقوق النشر */
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #71717a;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <!-- الشعار -->
        <div class="logo-container">
            <div class="logo">
                <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
        </div>

        <h1>ألترا بلس</h1>
        <div class="verified-badge">
            <span>✓</span> موثقين رسمياً للخدمات والاشتراكات
        </div>

        <!-- الأزرار -->
        <div class="links-container">
            <a href="store.html" class="btn btn-primary">
                <div class="btn-content">
                    <span>🛍️</span> تصفح المتجر والمنتجات
                </div>
                <span>←</span>
            </a>

            <a href="https://wa.me/9665xxxxxxxx?text=السلام عليكم، أريد الدعم الفني واستفسار" class="btn" target="_blank">
                <div class="btn-content">
                    <span>💬</span> الدعم الفني المباشر
                </div>
                <span>←</span>
            </a>
        </div>

        <!-- السوشيال ميديا -->
        <div class="social-icons">
            <a href="#" class="social-btn" title="Telegram">✈️</a>
            <a href="#" class="social-btn" title="Instagram">📸</a>
            <a href="#" class="social-btn" title="WhatsApp">💬</a>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 ULTRA PLUS
    </footer>

</body>
</html>
