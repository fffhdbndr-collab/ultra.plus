<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألترا بلس | ULTRA PLUS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="landing-body">

    <div class="landing-container">
        <!-- الأيقونة اللي فوق -->
        <div class="landing-logo">
            <i class="fa-solid fa-bolt"></i>
        </div>

        <!-- العنوان -->
        <h1 class="landing-title">ألترا بلس <span>| ULTRA PLUS</span></h1>
        
        <!-- شارة التوثيق -->
        <div class="verified-badge">
            <i class="fa-solid fa-circle-check"></i> موثق رسمياً لتقديم الخدمات والاشتراكات
        </div>

        <!-- زر الطلب (يوجه لصفحة المتجر store.html مباشرة) -->
        <a href="store.html" class="landing-btn">
            <div class="btn-left-content"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="btn-right-content">
                <span>اضغط هنا للطلب</span>
                <i class="fa-solid fa-bag-shopping"></i>
            </div>
        </a>

        <!-- زر الدعم الفني -->
        <a href="https://wa.me/" target="_blank" class="landing-btn">
            <div class="btn-left-content"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="btn-right-content">
                <span>اضغط هنا للدعم الفني</span>
                <i class="fa-brands fa-whatsapp"></i>
            </div>
        </a>

        <!-- أيقونات التواصل الاجتماعي -->
        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-telegram"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </div>

    <footer class="landing-footer">جميع الحقوق محفوظة © 2026</footer>

</body>
</html>
